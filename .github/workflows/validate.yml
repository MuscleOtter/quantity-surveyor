name: Validate package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -p 'test_updates.py'
      - run: python tests/test_memory_helper.py --package skills/universal-quantity-surveyor --work work/memory --output work/memory-results
      - run: python tests/test_missing_primary.py --package skills/universal-quantity-surveyor --work work/recovery --output work/recovery-results
      - run: python tools/build_release.py --out dist
